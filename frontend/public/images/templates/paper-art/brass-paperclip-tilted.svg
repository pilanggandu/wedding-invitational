<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 100 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="clipShadow" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#451A03" flood-opacity="0.32"/>
    </filter>
  </defs>
  <g filter="url(#clipShadow)" transform="rotate(12 50 90)">
    <!-- Classic looped metal wire paperclip -->
    <path d="M 32 140 
             L 32 40 
             A 18 18 0 0 1 68 40 
             L 68 145 
             A 14 14 0 0 1 40 145 
             L 40 60 
             A 10 10 0 0 1 60 60 
             L 60 135" 
          stroke="url(#brassGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>