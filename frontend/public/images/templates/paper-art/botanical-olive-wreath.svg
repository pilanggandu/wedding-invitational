<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hand-drawn Botanical Olive Wreath with Maroon Berries -->
  <!-- Left Half Wreath -->
  <path d="M 120 220 C 60 210, 24 160, 28 100 C 32 50, 70 24, 120 20" stroke="#657351" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Right Half Wreath -->
  <path d="M 120 220 C 180 210, 216 160, 212 100 C 208 50, 170 24, 120 20" stroke="#657351" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Olive Leaves on Left -->
  
    <path d="M 30 150 C 22 138, 22 130, 30 126 C 38 130, 38 138, 30 150 Z" 
          transform="rotate(-40 30 150)" fill="#7D8D66" stroke="#4D593D" stroke-width="1.2"/>
  
    <path d="M 26 110 C 18 98, 18 90, 26 86 C 34 90, 34 98, 26 110 Z" 
          transform="rotate(-70 26 110)" fill="#7D8D66" stroke="#4D593D" stroke-width="1.2"/>
  
    <path d="M 38 70 C 30 58, 30 50, 38 46 C 46 50, 46 58, 38 70 Z" 
          transform="rotate(-110 38 70)" fill="#7D8D66" stroke="#4D593D" stroke-width="1.2"/>
  
    <path d="M 74 38 C 66 26, 66 18, 74 14 C 82 18, 82 26, 74 38 Z" 
          transform="rotate(-140 74 38)" fill="#7D8D66" stroke="#4D593D" stroke-width="1.2"/>
  
    <path d="M 60 190 C 52 178, 52 170, 60 166 C 68 170, 68 178, 60 190 Z" 
          transform="rotate(-15 60 190)" fill="#7D8D66" stroke="#4D593D" stroke-width="1.2"/>
  
  <!-- Olive Leaves on Right -->
  
    <path d="M 210 150 C 202 138, 202 130, 210 126 C 218 130, 218 138, 210 150 Z" 
          transform="rotate(40 210 150)" fill="#7D8D66" stroke="#4D593D" stroke-width="1.2"/>
  
    <path d="M 214 110 C 206 98, 206 90, 214 86 C 222 90, 222 98, 214 110 Z" 
          transform="rotate(70 214 110)" fill="#7D8D66" stroke="#4D593D" stroke-width="1.2"/>
  
    <path d="M 202 70 C 194 58, 194 50, 202 46 C 210 50, 210 58, 202 70 Z" 
          transform="rotate(110 202 70)" fill="#7D8D66" stroke="#4D593D" stroke-width="1.2"/>
  
    <path d="M 166 38 C 158 26, 158 18, 166 14 C 174 18, 174 26, 166 38 Z" 
          transform="rotate(140 166 38)" fill="#7D8D66" stroke="#4D593D" stroke-width="1.2"/>
  
    <path d="M 180 190 C 172 178, 172 170, 180 166 C 188 170, 188 178, 180 190 Z" 
          transform="rotate(15 180 190)" fill="#7D8D66" stroke="#4D593D" stroke-width="1.2"/>
  
  <!-- Maroon Berries in clusters -->
  <circle cx="40" cy="130" r="3.5" fill="#7D1128"/><circle cx="44" cy="135" r="3.5" fill="#7D1128"/><circle cx="38" cy="90" r="3.5" fill="#7D1128"/><circle cx="44" cy="94" r="3.5" fill="#7D1128"/><circle cx="85" cy="34" r="3.5" fill="#7D1128"/><circle cx="90" cy="40" r="3.5" fill="#7D1128"/><circle cx="200" cy="130" r="3.5" fill="#7D1128"/><circle cx="196" cy="135" r="3.5" fill="#7D1128"/><circle cx="202" cy="90" r="3.5" fill="#7D1128"/><circle cx="196" cy="94" r="3.5" fill="#7D1128"/><circle cx="155" cy="34" r="3.5" fill="#7D1128"/><circle cx="150" cy="40" r="3.5" fill="#7D1128"/>
  <!-- Ribbon Bow at Bottom -->
  <circle cx="120" cy="220" r="5" fill="#7D1128"/>
  <path d="M 120 220 Q 105 235 95 230" stroke="#7D1128" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 120 220 Q 135 235 145 230" stroke="#7D1128" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>