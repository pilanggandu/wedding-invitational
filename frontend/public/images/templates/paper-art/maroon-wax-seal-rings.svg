    <circle cx="80" cy="80" r="44" stroke="#450A0A" stroke-width="2" opacity="0.8" fill="none"/>
    <!-- Stamped Interlocking Wedding Rings & Diamond -->
    <circle cx="73" cy="82" r="16" stroke="#FFE484" stroke-width="2.5" fill="none"/>
    <circle cx="87" cy="82" r="16" stroke="#FFE484" stroke-width="2.5" fill="none"/>
    <path d="M 73 63 L 76 58 L 80 63 L 77 66 Z" fill="#FFFFFF"/>
