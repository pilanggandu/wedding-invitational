      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#7D1128"/>
      <stop offset="85%" stop-color="#540816"/>
      <stop offset="100%" stop-color="#33040C"/>
    </radialGradient>
    <filter id="maroonShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#2D050B" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#maroonShadow)">
