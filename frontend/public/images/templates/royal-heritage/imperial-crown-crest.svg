<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crownGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF4DC"/>
      <stop offset="35%" stop-color="#C8A97E"/>
      <stop offset="70%" stop-color="#8C6D3F"/>
      <stop offset="100%" stop-color="#F2DEC4"/>
    </linearGradient>
  </defs>
  <!-- Outer Oval Beaded Wreath Frame -->
  <ellipse cx="110" cy="110" r="92" stroke="url(#crownGold)" stroke-width="1.5" stroke-dasharray="2 4"/>
  <ellipse cx="110" cy="110" r="84" stroke="url(#crownGold)" stroke-width="1"/>
  <!-- Imperial Crown at Top -->
  <path d="M 78 52 L 86 36 L 98 44 L 110 26 L 122 44 L 134 36 L 142 52 Z" fill="url(#crownGold)"/>
  <rect x="76" y="52" width="68" height="6" rx="2" fill="url(#crownGold)"/>
  <!-- Crown Jewels -->
  <circle cx="110" cy="24" r="3" fill="#FFFFFF"/>
  <circle cx="86" cy="34" r="2.5" fill="#52B788"/>
  <circle cx="134" cy="34" r="2.5" fill="#52B788"/>
  <circle cx="98" cy="42" r="2" fill="#E8D7B8"/>
  <circle cx="122" cy="42" r="2" fill="#E8D7B8"/>
  <!-- Laurel Branches flanking sides -->
  
    <ellipse cx="50" cy="88" rx="8" ry="3.5" transform="rotate(-60 50 88)" fill="url(#crownGold)"/>
    <ellipse cx="170" cy="88" rx="8" ry="3.5" transform="rotate(60 170 88)" fill="url(#crownGold)"/>
    
    <ellipse cx="50" cy="102" rx="8" ry="3.5" transform="rotate(-40 50 102)" fill="url(#crownGold)"/>
    <ellipse cx="170" cy="102" rx="8" ry="3.5" transform="rotate(40 170 102)" fill="url(#crownGold)"/>
    
    <ellipse cx="50" cy="116" rx="8" ry="3.5" transform="rotate(-20 50 116)" fill="url(#crownGold)"/>
    <ellipse cx="170" cy="116" rx="8" ry="3.5" transform="rotate(20 170 116)" fill="url(#crownGold)"/>
    
    <ellipse cx="50" cy="130" rx="8" ry="3.5" transform="rotate(0 50 130)" fill="url(#crownGold)"/>
    <ellipse cx="170" cy="130" rx="8" ry="3.5" transform="rotate(0 170 130)" fill="url(#crownGold)"/>
    
    <ellipse cx="50" cy="144" rx="8" ry="3.5" transform="rotate(20 50 144)" fill="url(#crownGold)"/>
    <ellipse cx="170" cy="144" rx="8" ry="3.5" transform="rotate(-20 170 144)" fill="url(#crownGold)"/>
    
    <ellipse cx="50" cy="158" rx="8" ry="3.5" transform="rotate(40 50 158)" fill="url(#crownGold)"/>
    <ellipse cx="170" cy="158" rx="8" ry="3.5" transform="rotate(-40 170 158)" fill="url(#crownGold)"/>
    
  <!-- Classical Serif Monogram in Center -->
  <text x="110" y="128" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="600" fill="url(#crownGold)" letter-spacing="2">R</text>
  <text x="110" y="148" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="9" font-weight="bold" fill="#E8D7B8" letter-spacing="4">HERITAGE</text>
</svg>