  <!-- Banner Text -->
  <text x="160" y="44" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="bold" fill="#0F2D24" letter-spacing="3">THE ROYAL UNION</text>
</svg>