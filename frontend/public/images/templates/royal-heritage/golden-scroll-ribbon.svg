<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 320 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ribbonGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A97E"/>
      <stop offset="50%" stop-color="#FFF2D6"/>
      <stop offset="100%" stop-color="#C8A97E"/>
    </linearGradient>
  </defs>
  <!-- Flowing Royal Heraldic Ribbon -->
  <!-- Left Tail -->
  <polygon points="16,35 48,22 48,58 16,70 28,52" fill="#8C6D3F"/>
  <!-- Right Tail -->
