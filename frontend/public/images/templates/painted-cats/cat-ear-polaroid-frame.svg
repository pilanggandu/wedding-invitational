<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 320 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="catFrameShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#7C2D12" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#catFrameShadow)">
    <!-- Cat Ears protruding from top of frame -->
    <!-- Left Ear -->
    <polygon points="48,60 72,12 108,60" fill="#FAF6EE" stroke="#E2D8CC" stroke-width="2"/>
    <polygon points="58,56 74,26 98,56" fill="#FBCFE8"/>
    <!-- Right Ear -->
    <polygon points="212,60 248,12 272,60" fill="#FAF6EE" stroke="#E2D8CC" stroke-width="2"/>
    <polygon points="222,56 246,26 262,56" fill="#FBCFE8"/>
    
    <!-- Polaroid Frame Body -->
    <rect x="24" y="52" width="272" height="312" rx="10" fill="#FAF6EE" stroke="#E2D8CC" stroke-width="2"/>
    <!-- Photo Window cutout -->
    <rect x="44" y="72" width="232" height="220" rx="4" fill="#3D271D"/>
    <!-- Cute Whiskers on photo frame borders -->
    <path d="M 28 200 L 14 195 M 28 206 L 12 206 M 28 212 L 14 217" stroke="#3D271D" stroke-width="2" stroke-linecap="round"/>
    <path d="M 292 200 L 306 195 M 292 206 L 308 206 M 292 212 L 306 217" stroke="#3D271D" stroke-width="2" stroke-linecap="round"/>
    <!-- Caption area hearts -->
    <text x="160" y="328" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="20" font-weight="bold" fill="#D97736">♥ purrfect together ♥</text>
  </g>
</svg>