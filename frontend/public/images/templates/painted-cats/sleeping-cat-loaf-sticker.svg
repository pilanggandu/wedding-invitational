<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 240 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="loafShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#D97736" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#loafShadow)">
    <!-- White Die-Cut Border -->
    <ellipse cx="120" cy="95" rx="88" ry="48" fill="#FFFFFF"/>
    <!-- Curled Cat Body (Calico Orange & Cream) -->
    <ellipse cx="120" cy="95" rx="80" ry="42" fill="#FED7AA" stroke="#3D271D" stroke-width="2.5"/>
    <!-- Orange Calico Patches -->
    <path d="M 80 58 C 110 55, 130 65, 120 90 C 100 95, 80 80, 80 58 Z" fill="#FB923C"/>
    <path d="M 150 70 C 180 70, 195 90, 180 110 C 160 110, 145 90, 150 70 Z" fill="#EA580C"/>
    <!-- Cat Head tucked in -->
    <circle cx="68" cy="85" r="30" fill="#FFF7ED" stroke="#3D271D" stroke-width="2.5"/>
    <!-- Cat Ears -->
    <polygon points="46,65 52,42 68,58" fill="#FB923C" stroke="#3D271D" stroke-width="2"/>
    <polygon points="76,58 92,42 96,65" fill="#FFF7ED" stroke="#3D271D" stroke-width="2"/>
    <!-- Closed Happy Eyes ^ ^ -->
    <path d="M 52 86 Q 58 80 64 86" stroke="#3D271D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 72 86 Q 78 80 84 86" stroke="#3D271D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Little Pink Nose & Mouth -->
    <polygon points="68,92 65,88 71,88" fill="#F472B6"/>
    <path d="M 68 92 Q 64 96 60 94 M 68 92 Q 72 96 76 94" stroke="#3D271D" stroke-width="1.8" fill="none"/>
    <!-- Pink Blushed Cheeks -->
    <circle cx="48" cy="92" r="5" fill="#FDA4AF" opacity="0.8"/>
    <circle cx="86" cy="92" r="5" fill="#FDA4AF" opacity="0.8"/>
    <!-- Curled Tail around body -->
    <path d="M 195 95 C 205 110, 185 130, 140 132" stroke="#EA580C" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 195 95 C 205 110, 185 130, 140 132" stroke="#3D271D" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Little Zzz floats -->
    <text x="74" y="38" font-family="'Caveat', sans-serif" font-size="14" font-weight="bold" fill="#D97736">z</text>
    <text x="86" y="26" font-family="'Caveat', sans-serif" font-size="18" font-weight="bold" fill="#EA580C">Z</text>
  </g>
</svg>