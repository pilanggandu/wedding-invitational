<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 500 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="anaStreak" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="48%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="52%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="anaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#93C5FD" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Long horizontal optical streak -->
  <ellipse cx="250" cy="70" rx="240" ry="4" fill="url(#anaStreak)"/>
  <ellipse cx="250" cy="70" rx="180" ry="1.5" fill="#FFFFFF"/>
  <!-- Central core bloom -->
  <circle cx="250" cy="70" r="38" fill="url(#anaCore)"/>
  <circle cx="250" cy="70" r="10" fill="#FFFFFF"/>
</svg>