<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <!-- Outer lens bezel -->
  <circle cx="100" cy="100" r="94" stroke="#DFD2BD" stroke-width="2" fill="#0B0D12"/>
  <circle cx="100" cy="100" r="88" stroke="#4B5563" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- 9-blade overlapping aperture -->
  <g transform="translate(100, 100)">
    
      <path d="M 0 0 L 52 -18 L 74 16 L 22 28 Z" 
            transform="rotate(0)" 
            fill="url(#bladeGrad)" 
            stroke="#DFD2BD" stroke-width="1.2"/>
      
      <path d="M 0 0 L 52 -18 L 74 16 L 22 28 Z" 
            transform="rotate(40)" 
            fill="url(#bladeGrad)" 
            stroke="#DFD2BD" stroke-width="1.2"/>
      
      <path d="M 0 0 L 52 -18 L 74 16 L 22 28 Z" 
            transform="rotate(80)" 
            fill="url(#bladeGrad)" 
            stroke="#DFD2BD" stroke-width="1.2"/>
      
      <path d="M 0 0 L 52 -18 L 74 16 L 22 28 Z" 
            transform="rotate(120)" 
            fill="url(#bladeGrad)" 
            stroke="#DFD2BD" stroke-width="1.2"/>
      
      <path d="M 0 0 L 52 -18 L 74 16 L 22 28 Z" 
            transform="rotate(160)" 
            fill="url(#bladeGrad)" 
            stroke="#DFD2BD" stroke-width="1.2"/>
      
      <path d="M 0 0 L 52 -18 L 74 16 L 22 28 Z" 
            transform="rotate(200)" 
            fill="url(#bladeGrad)" 
            stroke="#DFD2BD" stroke-width="1.2"/>
      
      <path d="M 0 0 L 52 -18 L 74 16 L 22 28 Z" 
            transform="rotate(240)" 
            fill="url(#bladeGrad)" 
            stroke="#DFD2BD" stroke-width="1.2"/>
      
      <path d="M 0 0 L 52 -18 L 74 16 L 22 28 Z" 
            transform="rotate(280)" 
            fill="url(#bladeGrad)" 
            stroke="#DFD2BD" stroke-width="1.2"/>
      
      <path d="M 0 0 L 52 -18 L 74 16 L 22 28 Z" 
            transform="rotate(320)" 
            fill="url(#bladeGrad)" 
            stroke="#DFD2BD" stroke-width="1.2"/>
      
    <!-- Center open aperture hole -->
    <polygon points="0,-14 11,-8 14,5 8,13 -6,14 -13,7 -12,-6 -3,-13" fill="#000000"/>
  </g>
</svg>