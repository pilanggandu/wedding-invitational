<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="slateShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#slateShadow)">
    <!-- Slanted Clapper Top Stick -->
    <g transform="rotate(-12 24 50)">
      <rect x="20" y="24" width="200" height="26" rx="3" fill="#14161C" stroke="#374151" stroke-width="1.5"/>
      <polygon points="32,24 48,24 38,50 22,50" fill="#FAF5EF"/><polygon points="64,24 80,24 70,50 54,50" fill="#FAF5EF"/><polygon points="96,24 112,24 102,50 86,50" fill="#FAF5EF"/><polygon points="128,24 144,24 134,50 118,50" fill="#FAF5EF"/><polygon points="160,24 176,24 166,50 150,50" fill="#FAF5EF"/><polygon points="192,24 208,24 198,50 182,50" fill="#FAF5EF"/>
    </g>
    <!-- Base Stick -->
    <rect x="20" y="52" width="200" height="22" rx="2" fill="#14161C" stroke="#374151" stroke-width="1.5"/>
    <polygon points="32,52 48,52 38,74 22,74" fill="#FAF5EF"/><polygon points="64,52 80,52 70,74 54,74" fill="#FAF5EF"/><polygon points="96,52 112,52 102,74 86,74" fill="#FAF5EF"/><polygon points="128,52 144,52 134,74 118,74" fill="#FAF5EF"/><polygon points="160,52 176,52 166,74 150,74" fill="#FAF5EF"/><polygon points="192,52 208,52 198,74 182,74" fill="#FAF5EF"/>
    <!-- Slate Body -->
    <rect x="20" y="76" width="200" height="110" rx="3" fill="#1E232E" stroke="#374151" stroke-width="1.5"/>
    <!-- Slate Grid Lines & Fields -->
    <line x1="20" y1="110" x2="220" y2="110" stroke="#4B5563" stroke-width="1"/>
    <line x1="20" y1="148" x2="220" y2="148" stroke="#4B5563" stroke-width="1"/>
    <line x1="90" y1="110" x2="90" y2="148" stroke="#4B5563" stroke-width="1"/>
    <line x1="155" y1="110" x2="155" y2="148" stroke="#4B5563" stroke-width="1"/>
    <!-- Chalk Headings -->
    <text x="30" y="94" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#9CA3AF">PRODUCTION</text>
    <text x="30" y="104" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#FAF7F2">OUR LOVE STORY</text>
    <text x="30" y="124" font-family="'Courier New', monospace" font-size="8" fill="#9CA3AF">SCENE</text>
    <text x="50" y="142" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#F59E0B">01</text>
    <text x="98" y="124" font-family="'Courier New', monospace" font-size="8" fill="#9CA3AF">TAKE</text>
    <text x="122" y="142" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#F59E0B">01</text>
    <text x="164" y="124" font-family="'Courier New', monospace" font-size="8" fill="#9CA3AF">FPS</text>
    <text x="186" y="142" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#FAF7F2">24</text>
    <text x="30" y="166" font-family="'Courier New', monospace" font-size="8" fill="#9CA3AF">DIRECTOR: DESTINY</text>
    <text x="30" y="178" font-family="'Courier New', monospace" font-size="8" fill="#9CA3AF">DATE: THE WEDDING DAY</text>
  </g>
</svg>