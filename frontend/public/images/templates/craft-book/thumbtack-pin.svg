<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pinShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#1E1712" flood-opacity="0.38"/>
    </filter>
    <radialGradient id="woodGrip" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#D97736"/>
      <stop offset="60%" stop-color="#A24A16"/>
      <stop offset="100%" stop-color="#5E260A"/>
    </radialGradient>
    <linearGradient id="metalPin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
  </defs>
  <g filter="url(#pinShadow)">
    <!-- Metal needle tip poking out behind -->
    <path d="M 46 64 L 24 94 L 40 76 Z" fill="url(#metalPin)"/>
    <!-- Wooden Grip Body -->
    <ellipse cx="60" cy="50" rx="32" ry="24" fill="url(#woodGrip)" stroke="#4A1E08" stroke-width="1.5"/>
    <!-- Top dome of thumbtack -->
    <ellipse cx="60" cy="42" rx="24" ry="16" fill="#F97316" opacity="0.85"/>
    <ellipse cx="56" cy="38" rx="8" ry="4" fill="#FED7AA" opacity="0.6"/>
  </g>
</svg>