<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 320 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="frameShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#2D231B" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="kraftPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EFE6DA"/>
    </linearGradient>
  </defs>
  <g filter="url(#frameShadow)">
    <!-- Polaroid Backing Card -->
    <rect x="16" y="16" width="288" height="348" rx="6" fill="url(#kraftPaper)" stroke="#DFD4C4" stroke-width="1.5"/>
    <!-- Photo Window Cutout Area -->
    <rect x="36" y="36" width="248" height="252" rx="2" fill="#2B2623" stroke="#D1C3B2" stroke-width="1"/>
    <!-- Subtle Inner Border in Photo Area -->
    <rect x="40" y="40" width="240" height="244" stroke="#FFF" stroke-width="1" stroke-dasharray="4 4" opacity="0.2"/>
    <!-- Handwritten note line guide at bottom -->
    <line x1="56" y1="324" x2="264" y2="324" stroke="#C4B4A2" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Corner Photo Slit accents -->
    <path d="M 32 48 L 48 32" stroke="#8C7A6B" stroke-width="2" stroke-linecap="round"/>
    <path d="M 288 48 L 272 32" stroke="#8C7A6B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>