    <!-- Inner stamped rim -->
    <circle cx="80" cy="80" r="48" stroke="#F19C84" stroke-width="2" opacity="0.6" fill="none"/>
    <circle cx="80" cy="80" r="44" stroke="#48180E" stroke-width="2" opacity="0.8" fill="none"/>
    <!-- Embossed Love Heart & Laurel -->
    <path d="M 80 94 C 80 94 62 82 62 68 C 62 60 68 54 75 54 C 78 54 80 57 80 57 C 80 57 82 54 85 54 C 92 54 98 60 98 68 C 98 82 80 94 80 94 Z" 
          fill="#D66C4E" stroke="#5E1F11" stroke-width="1.5"/>
    <!-- Little highlight gloss reflection -->
    <ellipse cx="64" cy="46" rx="14" ry="7" transform="rotate(-30 64 46)" fill="#FED7AA" opacity="0.25"/>
  </g>
</svg>