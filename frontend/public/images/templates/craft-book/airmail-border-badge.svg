<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 300 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="airmailShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#airmailShadow)">
    <rect x="10" y="10" width="280" height="120" rx="4" fill="#FAF6EE" stroke="#E3D7C5" stroke-width="1.5"/>
    <!-- Airmail diagonal stripes at top and bottom -->
    <g clip-path="url(#airmailClip)">
      <clipPath id="airmailClip">
        <rect x="10" y="10" width="280" height="120" rx="4"/>
      </clipPath>
      
        <polygon points="-20,10 -6,10 -16,20 -30,20" fill="#C24134"/>
        <polygon points="-20,120 -6,120 4,130 -10,130" fill="#C24134"/>
        
        <polygon points="2,10 16,10 6,20 -8,20" fill="#2563EB"/>
        <polygon points="2,120 16,120 26,130 12,130" fill="#2563EB"/>
        
        <polygon points="24,10 38,10 28,20 14,20" fill="#C24134"/>
        <polygon points="24,120 38,120 48,130 34,130" fill="#C24134"/>
        
        <polygon points="46,10 60,10 50,20 36,20" fill="#2563EB"/>
        <polygon points="46,120 60,120 70,130 56,130" fill="#2563EB"/>
        
        <polygon points="68,10 82,10 72,20 58,20" fill="#C24134"/>
        <polygon points="68,120 82,120 92,130 78,130" fill="#C24134"/>
        
        <polygon points="90,10 104,10 94,20 80,20" fill="#2563EB"/>
        <polygon points="90,120 104,120 114,130 100,130" fill="#2563EB"/>
        
        <polygon points="112,10 126,10 116,20 102,20" fill="#C24134"/>
        <polygon points="112,120 126,120 136,130 122,130" fill="#C24134"/>
        
        <polygon points="134,10 148,10 138,20 124,20" fill="#2563EB"/>
        <polygon points="134,120 148,120 158,130 144,130" fill="#2563EB"/>
        
        <polygon points="156,10 170,10 160,20 146,20" fill="#C24134"/>
        <polygon points="156,120 170,120 180,130 166,130" fill="#C24134"/>
        
        <polygon points="178,10 192,10 182,20 168,20" fill="#2563EB"/>
        <polygon points="178,120 192,120 202,130 188,130" fill="#2563EB"/>
        
        <polygon points="200,10 214,10 204,20 190,20" fill="#C24134"/>
        <polygon points="200,120 214,120 224,130 210,130" fill="#C24134"/>
        
        <polygon points="222,10 236,10 226,20 212,20" fill="#2563EB"/>
        <polygon points="222,120 236,120 246,130 232,130" fill="#2563EB"/>
        
        <polygon points="244,10 258,10 248,20 234,20" fill="#C24134"/>
        <polygon points="244,120 258,120 268,130 254,130" fill="#C24134"/>
        
        <polygon points="266,10 280,10 270,20 256,20" fill="#2563EB"/>
        <polygon points="266,120 280,120 290,130 276,130" fill="#2563EB"/>
        
        <polygon points="288,10 302,10 292,20 278,20" fill="#C24134"/>
        <polygon points="288,120 302,120 312,130 298,130" fill="#C24134"/>
        
        <polygon points="310,10 324,10 314,20 300,20" fill="#2563EB"/>
        <polygon points="310,120 324,120 334,130 320,130" fill="#2563EB"/>
        
    </g>
    <!-- Center Airmail Badge Stamp -->
    <rect x="74" y="38" width="152" height="48" rx="2" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="150" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#FAF7F2" letter-spacing="3">BY AIR MAIL</text>
    <text x="150" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#FED7AA" letter-spacing="4">PAR AVION</text>
    <!-- Postmark circular stamp ring -->
    <circle cx="242" cy="70" r="26" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="4 2" fill="none" opacity="0.75"/>
    <text x="242" y="68" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#991B1B" opacity="0.8">WEDDING</text>
    <text x="242" y="78" text-anchor="middle" font-family="monospace" font-size="7" fill="#991B1B" opacity="0.8">SPECIAL PASS</text>
  </g>
</svg>