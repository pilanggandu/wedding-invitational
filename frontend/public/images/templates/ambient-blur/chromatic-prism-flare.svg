<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="prismRainbow" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#EC4899" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FDE68A" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#F43F5E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Horizontal optical anamorphic beam -->
  <ellipse cx="200" cy="100" rx="190" ry="12" fill="url(#prismRainbow)" opacity="0.75"/>
  <ellipse cx="200" cy="100" rx="140" ry="4" fill="#FFFFFF" opacity="0.9"/>
  <!-- Central lens glare circle -->
  <circle cx="200" cy="100" r="45" fill="url(#coreGlare)"/>
  <circle cx="200" cy="100" r="16" fill="#FFFFFF"/>
  <!-- Angled chromatic light beams -->
  <polygon points="120,40 280,160 270,165 110,45" fill="#38BDF8" opacity="0.35"/>
  <polygon points="110,155 270,45 280,50 120,160" fill="#EC4899" opacity="0.35"/>
</svg>