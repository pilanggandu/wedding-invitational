  <path d="M 24 444 L 36 444 M 36 456 L 36 444" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 336 444 L 324 444 M 324 456 L 324 444" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Top subtle pill accent -->
