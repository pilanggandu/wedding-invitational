<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 440 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Natural Paper Elevation Shadow (Soft matte, non-glossy) -->
    <filter id="paperElevation1" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#382218" flood-opacity="0.14"/>
    </filter>
    <filter id="paperElevation2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="4" stdDeviation="5" flood-color="#2D1A12" flood-opacity="0.18"/>
    </filter>
    <filter id="paperElevation3" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#24140D" flood-opacity="0.22"/>
    </filter>
    <!-- Paper Grain Subtle Texture Pattern -->
    <pattern id="linenPaperGrain" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#F8F3EA"/>
      <path d="M 0 10 L 40 10 M 0 20 L 40 20 M 0 30 L 40 30" stroke="#EDE2D0" stroke-width="0.5" opacity="0.6"/>
      <path d="M 10 0 L 10 40 M 20 0 L 20 40 M 30 0 L 30 40" stroke="#EDE2D0" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Base Layer: Warm Deckled Linen Paper Swatch -->
  <g filter="url(#paperElevation1)">
    <rect x="20" y="20" width="400" height="400" rx="16" fill="url(#linenPaperGrain)" stroke="#E5D9C7" stroke-width="1.5"/>
    <rect x="28" y="28" width="384" height="384" rx="12" fill="none" stroke="#D8C7B2" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

