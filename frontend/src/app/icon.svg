<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="maroon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#672229" />
      <stop offset="100%" stop-color="#3A1216" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BE" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7A1E" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
    <filter id="ring-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.35" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="124" fill="url(#maroon-grad)" />
  
  <!-- Outer Gold Border -->
  <rect x="22" y="22" width="468" height="468" rx="104" fill="none" stroke="url(#gold-grad)" stroke-width="8" opacity="0.9" />
  
  <!-- Inner Delicate Circle -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.55" />

  <!-- Interlocking Rings Group -->
  <g filter="url(#ring-shadow)">
    <!-- Left Ring (Akad) -->
    <ellipse cx="216" cy="272" rx="78" ry="62" transform="rotate(-28 216 272)" fill="none" stroke="url(#gold-grad)" stroke-width="24" stroke-linecap="round" />
    <ellipse cx="216" cy="272" rx="78" ry="62" transform="rotate(-28 216 272)" fill="none" stroke="#FFF5D6" stroke-width="6" opacity="0.75" />

    <!-- Right Ring (Resepsi) -->
    <ellipse cx="296" cy="238" rx="78" ry="62" transform="rotate(28 296 238)" fill="none" stroke="url(#gold-grad)" stroke-width="24" stroke-linecap="round" />
    <ellipse cx="296" cy="238" rx="78" ry="62" transform="rotate(28 296 238)" fill="none" stroke="#FFF5D6" stroke-width="6" opacity="0.75" />

    <!-- Diamond on Right Ring -->
    <path d="M 346 166 L 364 186 L 346 210 L 328 186 Z" fill="#FFFFFF" stroke="url(#gold-grad)" stroke-width="3" />
    
    <!-- Sparkle Star -->
    <path d="M 346 142 Q 346 162 326 162 Q 346 162 346 182 Q 346 162 366 162 Q 346 162 346 142 Z" fill="#FFF8E7" />
    <circle cx="152" cy="190" r="4" fill="#FFF0BE" />
    <circle cx="360" cy="330" r="4" fill="#FFF0BE" />
  </g>

  <!-- Monogram Initials "G & S" -->
  <text x="256" y="378" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="bold" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="4">G &amp; S</text>
</svg>
